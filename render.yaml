services:
  - type: web
    name: dpp-forge
    runtime: python
    buildCommand: |
      pip install -r backend/requirements.txt
      npm install && npm run build
      mkdir -p backend/static && cp -r dist/* backend/static/
    startCommand: cd backend && gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CONSTRUCTASK_URL
        value: https://constructask.vercel.app
      - key: TDS_GEMINI_API_KEY
        sync: false
      - key: TDS_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DEMO_SEED_ENABLED
        value: false
      - key: ENABLE_PASSPORT_DELETE
        value: false
      - key: CORS_ORIGINS
        sync: false

services:
  - type: web
    name: dpp-forge
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --preload
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CONSTRUCTASK_URL
        value: https://constructask.vercel.app
      - key: TDS_GEMINI_API_KEY
        sync: false
      - key: TDS_GEMINI_MODEL
        value: gemini-1.5-flash
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: ENABLE_PASSPORT_DELETE
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.6"
